<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Middleware status</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 3rem auto; padding: 0 1rem; color: #1f2328; }
  h1 { font-size: 1.4rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1.5rem; }
  dt { color: #59636e; }
  .ok { color: #1a7f37; }
  .bad { color: #cf222e; }
  textarea { width: 100%; box-sizing: border-box; height: 6rem; font: inherit; }
  button { font: inherit; padding: .4rem 1rem; }
  pre { background: #f6f8fa; padding: 1rem; overflow: auto; min-height: 3rem; white-space: pre-wrap; }
  a { color: #0969da; }
</style>
</head>
<body>
<h1>Middleware status</h1>
<dl>
  <dt>Liveness</dt><dd id="health">checking</dd>
  <dt>Readiness</dt><dd id="ready">checking</dd>
  <dt>Models</dt><dd id="models">checking</dd>
</dl>
<h2>Try the proxy</h2>
<p>Sent through <code>POST /v1/chat/completions</code> with the system prompt injected, streamed back as it arrives.</p>
<textarea id="input">Fwd: payment - Hi, attached the receipt from Cafe Luna, 14/03 2024, 2x espresso 9.00, 1 croissant 4.50, total 13.5 eur. paid by card ****4421. - Dana</textarea>
<p><button id="send">Send</button> <span id="timing"></span></p>
<pre id="output"></pre>
<p><a href="/docs">OpenAPI docs</a></p>
<script>
  const set = (id, text, ok) => {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = ok ? "ok" : "bad";
  };

  const probe = async (id, url, render) => {
    try {
      const response = await fetch(url);
      const body = await response.json();
      set(id, render(body), response.ok);
    } catch (error) {
      set(id, String(error), false);
    }
  };

  let models = [];
  const refresh = () => {
    probe("health", "/health", (body) => body.status);
    probe("ready", "/ready", (body) => body.status);
    probe("models", "/v1/models", (body) => {
      models = body.data.map((model) => model.id);
      return models.join(", ") || "none visible";
    });
  };
  refresh();
  setInterval(refresh, 10000);

  document.getElementById("send").addEventListener("click", async () => {
    const output = document.getElementById("output");
    const timing = document.getElementById("timing");
    output.textContent = "";
    timing.textContent = "";
    const started = performance.now();
    const response = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: models[0],
        stream: true,
        messages: [{ role: "user", content: document.getElementById("input").value }],
      }),
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const event of events) {
        const data = event.replace(/^data: /, "");
        if (data === "[DONE]") continue;
        const chunk = JSON.parse(data);
        output.textContent += chunk.error ? `\n[error] ${chunk.error.message}` : chunk.choices?.[0]?.delta?.content ?? "";
      }
    }
    timing.textContent = `${Math.round(performance.now() - started)} ms, request ${response.headers.get("X-Request-ID")}`;
  });
</script>
</body>
</html>
