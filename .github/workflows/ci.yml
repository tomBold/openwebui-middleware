name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: middleware/uv.lock
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest --junitxml=test-results.xml --cov-report=xml --cov-report=term-missing
      - name: Write the test report to the job summary
        if: always()
        run: |
          {
            echo "### Tests on ${{ matrix.os }}, Python ${{ matrix.python-version }}"
            uv run python -c "import xml.etree.ElementTree as ET; s = ET.parse('test-results.xml').getroot()[0].attrib; print(f\"{int(s['tests']) - int(s['failures']) - int(s['errors']) - int(s['skipped'])} passed, {s['failures']} failed, {s['skipped']} skipped in {float(s['time']):.2f}s\n\")"
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            middleware/test-results.xml
            middleware/coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Reject CRLF line endings in shell scripts
        run: "! grep -rlU $'\\r' scripts/*.sh"
      - name: Check shell syntax
        run: bash -n scripts/start.sh && bash -n scripts/smoke.sh
      - name: Install shellcheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Verify every tracked text file is valid UTF-8
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            git grep -Iq --no-index -e '' -- "$file" || continue
            iconv -f UTF-8 -t UTF-8 "$file" >/dev/null || { echo "not UTF-8: $file"; exit 1; }
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Run the checks inside the image, the way a reviewer without Python would
        uses: docker/build-push-action@v7
        with:
          context: middleware
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: middleware
          push: false
          load: true
          tags: middleware:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image serves /health
        run: |
          docker run -d --name middleware -p 8000:8000 -e OPENAI_API_KEY=ci-placeholder middleware:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs middleware
          exit 1
